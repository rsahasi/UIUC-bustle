name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches backend/Dockerfile
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        env:
          # Set explicitly so a missing secret can never masquerade as a
          # dependency-override bug (that combination previously produced two
          # order-dependent 503 failures).
          SUPABASE_JWT_SECRET: test-secret-for-ci
          MTD_API_KEY: ""
          CLAUDE_API_KEY: ""
        run: python -m pytest tests/ -q
      - name: Tests are order-independent
        env:
          SUPABASE_JWT_SECRET: test-secret-for-ci
        run: |
          python -m pytest tests/test_share.py tests/test_auth.py tests/test_recommendation.py -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test:ci
      - name: Bundle (catches unresolvable imports npm ci cannot)
        run: npx expo export --platform ios --output-dir /tmp/expo-ci

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t uiuc-backend:ci ./backend
