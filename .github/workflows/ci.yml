name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  mobile:
    name: Mobile (jest + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: node_modules/.bin/jest --ci --forceExit
      # Non-blocking: ~25 pre-existing strict-mode type errors remain (app/(tabs)/
      # index|map|schedule.tsx and a couple of real type mismatches). Flip to
      # blocking once they're fixed — tracked in docs/PRODUCTION_READINESS.md.
      - name: Typecheck (non-blocking)
        continue-on-error: true
        run: node_modules/.bin/tsc --noEmit
